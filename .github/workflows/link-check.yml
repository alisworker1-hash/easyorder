name: Link Check

# easyorder has no package manager and no lockfile (static HTML/JS/CSS plus
# a dependency-free Cloudflare Worker in proxy/), so OSV-Scanner has nothing
# to scan. The equivalent free, zero-maintenance check for a static site is
# a broken-link/HTML sanity pass — catches dead links and malformed HTML
# before a client ever sees them.

on:
  push:
    branches: [main]
  # Run on PRs too, not just after merge. Without this the job only fires once a
  # change is already on main, so a dead link reaches the published site and is
  # reported afterwards — which inverts the point of the check. (Same gap was
  # fixed in dupecheck, where a PR looked green on its branch and went red the
  # instant it landed.) Uses `pull_request`, NOT `pull_request_target`, so a fork
  # PR runs with a read-only token and no access to secrets; this job needs
  # neither, and permissions stay contents: read.
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

# Repeated pushes to a PR shouldn't leave superseded runs fetching third-party
# URLs; keep only the newest run per ref.
concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './**/*.html'
          fail: true
